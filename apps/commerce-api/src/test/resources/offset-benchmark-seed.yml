# 전용 시드 설정. 일반 실행은 기존 스키마를 validate하고, DDL은 CLI의 schema-only에서만 생성한다.
spring:
  main:
    web-application-type: none
    banner-mode: "off"
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        timezone.default_storage: NORMALIZE_UTC
        jdbc.time_zone: UTC
logging:
  level:
    root: WARN
datasource:
  mysql-jpa:
    main:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://127.0.0.1:13306/loopers_offset_bench
      username: application
      password: application
      maximum-pool-size: 2
      minimum-idle: 1
      data-source-properties:
        rewriteBatchedStatements: true
